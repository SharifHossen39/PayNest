spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${PAYNEST_TEST_DB_URL}
    username: ${PAYNEST_TEST_DB_USERNAME}
    password: ${PAYNEST_TEST_DB_PASSWORD}
    hikari:
      connection-init-sql: >-
        DO $guard$ BEGIN
        IF current_database() IS DISTINCT FROM 'paynest_test' THEN
        RAISE EXCEPTION 'Test connection refused: database must be exactly paynest_test' USING ERRCODE = '3D000';
        END IF;
        END; $guard$;

paynest:
  jwt:
    secret: ${PAYNEST_JWT_SECRET:dGVzdC1vbmx5LXBheW5lc3Qtand0LXNlY3JldC0zMmI=}
    ttl: ${PAYNEST_JWT_TTL:60m}
