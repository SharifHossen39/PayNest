spring:
  application:
    name: paynest
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${PAYNEST_DB_URL:jdbc:postgresql://localhost:5432/paynest}
    username: ${PAYNEST_DB_USERNAME:paynest_local}
    password: ${PAYNEST_DB_PASSWORD:local-only-placeholder}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: paynest
    schemas: paynest
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: paynest
    open-in-view: false

logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR

paynest:
  database:
    lock-timeout: ${PAYNEST_DB_LOCK_TIMEOUT:5s}
  jwt:
    secret: ${PAYNEST_JWT_SECRET}
    ttl: ${PAYNEST_JWT_TTL:60m}
